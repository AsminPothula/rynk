name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
    paths:
      - "apps/wordpress/themes/rynk/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        working-directory: apps/wordpress/themes/rynk/build
        run: |
          npm install
          npm run build

      - name: Deploy Rynk theme to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: rynkai
          SRC_PATH: "apps/wordpress/themes/rynk/"
          REMOTE_PATH: "wp-content/themes/rynk/"
          # NOTE: WP Engine serves PHP through OPcache and blocks the OPcache API
          # from web-root scripts (opcache.restrict_api=/opt/), so a deployed
          # template's changes only go live after WP Engine restarts PHP. A
          # self-serve cache-clear cannot do this; ask WP Engine to restart PHP,
          # or have them enable opcache.validate_timestamps on the environment.
