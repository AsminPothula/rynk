name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
    paths:
      - "apps/wordpress/themes/rynk/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        working-directory: apps/wordpress/themes/rynk/build
        run: |
          npm install
          npm run build

      - name: Deploy Rynk theme to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: rynkai
          SRC_PATH: "apps/wordpress/themes/rynk/"
          # The ACTIVE theme on the rynkai install lives in themes/rynk-ai/
          # (its directory slug is "rynk-ai"), not themes/rynk/. Deploy into the
          # active directory or the live site never sees the changes.
          REMOTE_PATH: "wp-content/themes/rynk-ai/"
