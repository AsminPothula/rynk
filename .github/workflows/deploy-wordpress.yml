name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
    paths:
      - "apps/wordpress/themes/rynk/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        working-directory: apps/wordpress/themes/rynk/build
        run: |
          npm install
          npm run build

      - name: Deploy Rynk theme to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: rynkai
          SRC_PATH: "apps/wordpress/themes/rynk/"
          REMOTE_PATH: "wp-content/themes/rynk/"

      # WP Engine's OPcache doesn't revalidate on file mtime, so freshly
      # deployed templates keep serving old bytecode until PHP restarts. This
      # force-invalidates OPcache for the theme's own files (see
      # opcache-refresh.php) so the deploy goes live immediately. Non-fatal.
      - name: Refresh theme OPcache
        run: |
          url="https://rynkai.wpengine.com/wp-content/themes/rynk/opcache-refresh.php?token=rynk-refresh&cb=${{ github.run_id }}"
          echo "Hitting: $url"
          curl -sS -L -w "\nHTTP %{http_code}\n" "$url" || echo "opcache refresh request failed (non-fatal)"
