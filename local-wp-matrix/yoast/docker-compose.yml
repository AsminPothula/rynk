# WordPress + Yoast SEO + pretty permalinks. Port 8081.

services:
  db:
    image: mysql:8
    container_name: rynk-matrix-yoast-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  wp:
    image: wordpress:latest
    container_name: rynk-matrix-yoast-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html

  init:
    image: wordpress:cli
    container_name: rynk-matrix-yoast-init
    depends_on:
      - wp
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./.secrets:/rynk-secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "waiting for wp files..."
        until [ -f /var/www/html/wp-config.php ]; do sleep 2; done

        echo "waiting for db..."
        until wp db check --allow-root >/dev/null 2>&1; do sleep 2; done

        echo "installing wp if needed..."
        wp core install \
          --url=http://localhost:8081 \
          --title="Rynk Matrix - yoast" \
          --admin_user=admin \
          --admin_password=admin \
          --admin_email=admin@rynk.test \
          --skip-email \
          --allow-root || echo "already installed"

        echo "installing + activating Yoast SEO..."
        wp plugin install wordpress-seo --activate --allow-root

        echo "setting pretty permalinks..."
        wp rewrite structure "/%postname%/" --allow-root
        wp rewrite flush --hard --allow-root

        echo "ensuring a sample published page..."
        wp post exists 2 --allow-root >/dev/null 2>&1 || \
          wp post create \
            --post_type=page \
            --post_title="Sample Page" \
            --post_content="<p>Sample page for rynk matrix testing.</p>" \
            --post_status=publish \
            --allow-root

        echo "generating rynk-matrix Application Password..."
        wp user application-password delete admin --all --allow-root >/dev/null 2>&1 || true
        APP_PW=$$(wp user application-password create admin rynk-matrix --porcelain --allow-root)

        TEST_SLUG=$$(wp post list --post_type=page --post_status=publish --field=post_name --posts_per_page=1 --allow-root | head -n1)

        cat > /rynk-secrets/config.json <<EOF
        {
          "config": "yoast",
          "url": "http://localhost:8081",
          "user": "admin",
          "appPassword": "$$APP_PW",
          "testPage": "http://localhost:8081/$${TEST_SLUG}/"
        }
        EOF

        echo "matrix config ready"
    restart: "no"

volumes:
  db_data:
  wp_data:
