# WordPress + Yoast + simulated Divi Builder page. Port 8085.
#
# Divi is a paid theme by Elegant Themes and can't be installed via
# wordpress.org. Since our test is only about the SKIP guard firing,
# the init container creates a page with `_et_pb_use_builder = on`
# postmeta - exactly what a real Divi-managed page carries. Our
# detectPageBuilder() returns "divi" for it.

services:
  db:
    image: mysql:8
    container_name: rynk-matrix-divi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  wp:
    image: wordpress:latest
    container_name: rynk-matrix-divi-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html

  init:
    image: wordpress:cli
    container_name: rynk-matrix-divi-init
    depends_on:
      - wp
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./.secrets:/rynk-secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "waiting for wp files..."
        until [ -f /var/www/html/wp-config.php ]; do sleep 2; done
        echo "waiting for db..."
        until wp db check --allow-root >/dev/null 2>&1; do sleep 2; done

        wp core install \
          --url=http://localhost:8085 \
          --title="Rynk Matrix - divi" \
          --admin_user=admin \
          --admin_password=admin \
          --admin_email=admin@rynk.test \
          --skip-email \
          --allow-root || echo "already installed"

        wp plugin install wordpress-seo --activate --allow-root

        wp rewrite structure "/%postname%/" --allow-root
        wp rewrite flush --hard --allow-root

        wp post exists 2 --allow-root >/dev/null 2>&1 || \
          wp post create \
            --post_type=page \
            --post_title="Sample Page" \
            --post_content="<p>Standard editor page for rynk matrix testing.</p>" \
            --post_status=publish \
            --allow-root

        echo "ensuring a Divi-managed page..."
        DIVI_ID=$$(wp post list --post_type=page --name=divi-page --field=ID --allow-root)
        if [ -z "$$DIVI_ID" ]; then
          DIVI_ID=$$(wp post create \
            --post_type=page \
            --post_title="Divi Page" \
            --post_name=divi-page \
            --post_content="<p>Placeholder - Divi renders from shortcodes + postmeta.</p>" \
            --post_status=publish \
            --porcelain \
            --allow-root)
        fi
        wp post meta update $$DIVI_ID _et_pb_use_builder on --allow-root >/dev/null

        wp user application-password delete admin --all --allow-root >/dev/null 2>&1 || true
        APP_PW=$$(wp user application-password create admin rynk-matrix --porcelain --allow-root)

        TEST_SLUG=$$(wp post list --post_type=page --post_status=publish --field=post_name --posts_per_page=1 --exclude=$$DIVI_ID --allow-root | head -n1)

        cat > /rynk-secrets/config.json <<EOF
        {
          "config": "divi",
          "url": "http://localhost:8085",
          "user": "admin",
          "appPassword": "$$APP_PW",
          "testPage": "http://localhost:8085/$${TEST_SLUG}/",
          "diviPage": "http://localhost:8085/divi-page/",
          "diviPageId": "$${DIVI_ID}"
        }
        EOF

        echo "matrix config ready"
    restart: "no"

volumes:
  db_data:
  wp_data:
