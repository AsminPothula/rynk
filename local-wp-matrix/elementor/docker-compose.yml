# WordPress + Elementor + Yoast SEO + pretty permalinks. Port 8082.
#
# This config's purpose is to exercise rynk's page-builder skip guards.
# The init container creates a page with Elementor's edit-mode meta set
# so our detectPageBuilder() returns "elementor" for it.

services:
  db:
    image: mysql:8
    container_name: rynk-matrix-elementor-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  wp:
    image: wordpress:latest
    container_name: rynk-matrix-elementor-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html

  init:
    image: wordpress:cli
    container_name: rynk-matrix-elementor-init
    depends_on:
      - wp
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./.secrets:/rynk-secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "waiting for wp files..."
        until [ -f /var/www/html/wp-config.php ]; do sleep 2; done

        echo "waiting for db..."
        until wp db check --allow-root >/dev/null 2>&1; do sleep 2; done

        echo "installing wp if needed..."
        wp core install \
          --url=http://localhost:8082 \
          --title="Rynk Matrix - elementor" \
          --admin_user=admin \
          --admin_password=admin \
          --admin_email=admin@rynk.test \
          --skip-email \
          --allow-root || echo "already installed"

        echo "installing + activating Yoast + Elementor..."
        wp plugin install wordpress-seo --activate --allow-root
        wp plugin install elementor --activate --allow-root

        echo "setting pretty permalinks..."
        wp rewrite structure "/%postname%/" --allow-root
        wp rewrite flush --hard --allow-root

        echo "ensuring a standard (non-elementor) test page..."
        wp post exists 2 --allow-root >/dev/null 2>&1 || \
          wp post create \
            --post_type=page \
            --post_title="Sample Page" \
            --post_content="<p>Standard editor page for rynk matrix testing.</p>" \
            --post_status=publish \
            --allow-root

        echo "ensuring an Elementor-managed page..."
        # Create the page if it doesn't exist yet, then set the Elementor
        # postmeta flag so our detectPageBuilder() recognizes it.
        ELEM_ID=$$(wp post list --post_type=page --name=elementor-page --field=ID --allow-root)
        if [ -z "$$ELEM_ID" ]; then
          ELEM_ID=$$(wp post create \
            --post_type=page \
            --post_title="Elementor Page" \
            --post_name=elementor-page \
            --post_content="<p>Placeholder - Elementor renders from _elementor_data.</p>" \
            --post_status=publish \
            --porcelain \
            --allow-root)
        fi
        wp post meta update $$ELEM_ID _elementor_edit_mode builder --allow-root >/dev/null
        wp post meta update $$ELEM_ID _elementor_version 3.20.0 --allow-root >/dev/null

        echo "generating rynk-matrix Application Password..."
        wp user application-password delete admin --all --allow-root >/dev/null 2>&1 || true
        APP_PW=$$(wp user application-password create admin rynk-matrix --porcelain --allow-root)

        TEST_SLUG=$$(wp post list --post_type=page --post_status=publish --field=post_name --posts_per_page=1 --exclude=$$ELEM_ID --allow-root | head -n1)

        cat > /rynk-secrets/config.json <<EOF
        {
          "config": "elementor",
          "url": "http://localhost:8082",
          "user": "admin",
          "appPassword": "$$APP_PW",
          "testPage": "http://localhost:8082/$${TEST_SLUG}/",
          "elementorPage": "http://localhost:8082/elementor-page/",
          "elementorPageId": "$${ELEM_ID}"
        }
        EOF

        echo "matrix config ready"
    restart: "no"

volumes:
  db_data:
  wp_data:
